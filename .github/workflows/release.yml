name: Build and publish release

# Runs on the PUBLIC repo for unlimited GitHub Actions minutes.
# Clones the PRIVATE source repo using SUPERCHARGE_SOURCE_TOKEN, builds
# cross-platform binaries, and publishes a GitHub Release here.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.3.39
        required: true
        default: v1.3.39
        type: string
      source_ref:
        description: Git ref to build from in the private source repo (tag, branch, or SHA)
        required: true
        default: main
        type: string
      source_repo:
        description: Private source repository (owner/name)
        required: true
        default: supercharge-cli/supercharge
        type: string
      build_daemon:
        description: Also build the linux daemon binary for E2B/self-host
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [release]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: 1.94.1
  RUSTFLAGS: -C debuginfo=0
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.client_payload.source_ref || github.event.client_payload.tag }}
  SOURCE_REPO: ${{ github.event_name == 'workflow_dispatch' && inputs.source_repo || github.event.client_payload.source_repo || 'supercharge-cli/supercharge' }}

jobs:
  build-cli:
    name: CLI ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
            rg_triple: x86_64-unknown-linux-musl
            runnable: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            ext: ""
            rg_triple: aarch64-unknown-linux-gnu
            runnable: true
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            ext: ""
            rg_triple: x86_64-apple-darwin
            runnable: false
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            ext: ""
            rg_triple: aarch64-apple-darwin
            runnable: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: .exe
            rg_triple: ""
            runnable: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
            ext: .exe
            rg_triple: ""
            runnable: false
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SUPERCHARGE_SOURCE_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Install native build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler pkg-config libdbus-1-dev
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
          rm -f source/bin/protoc

      - name: Install native build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
          rm -f source/bin/protoc

      - name: Install native build prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --no-progress -y
          $tools = "C:\ProgramData\chocolatey\lib\protoc\tools"
          $protoc = Join-Path $tools "bin\protoc.exe"
          if (-not (Test-Path $protoc)) { $protoc = (Get-Command protoc).Source }
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path source/bin/protoc) { Remove-Item source/bin/protoc -Force }

      - name: Vendor ripgrep for release bundling
        if: matrix.rg_triple != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dest="$HOME/vendor/rg-src"
          mkdir -p "$dest" "$HOME/vendor"
          url="https://github.com/BurntSushi/ripgrep/releases/download/15.0.0/ripgrep-15.0.0-${{ matrix.rg_triple }}.tar.gz"
          curl -fL --retry 8 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o "$HOME/vendor/rg.tgz" "$url"
          tar -xzf "$HOME/vendor/rg.tgz" -C "$dest"
          rg_bin="$(find "$dest" -type f -name rg | head -n 1)"
          test -n "$rg_bin"
          chmod +x "$rg_bin"
          cp "$rg_bin" "$HOME/vendor/rg"
          echo "SUPERCHARGE_TOOLS_BUNDLE_RG_PATH=$HOME/vendor/rg" >> "$GITHUB_ENV"
          echo "SUPERCHARGE_SHELL_BUNDLE_RG_PATH=$HOME/vendor/rg" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Size flags (linux-gnu)
        if: contains(matrix.target, 'linux-gnu')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C force-unwind-tables=no" >> "$GITHUB_ENV"

      - name: Thin LTO (linux-aarch64, avoid OOM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=thin" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      # Fat LTO + cgu=1 is what keeps the shipped binary small, but it runs the
      # whole-program optimization pass on one thread. On the 3-4 core macOS and
      # Windows runners that pass is nearly the entire build. Thin LTO still
      # inlines across crates and drops dead code, just per-CGU in parallel;
      # binary delta is ~1-3%, well inside the xz-compressed asset size.
      - name: Faster LTO on slow runners (macOS/Windows)
        if: runner.os == 'macOS' || runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=thin" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"

      - name: Stamp release version into the build
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "SUPERCHARGE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build Supercharge CLI
        working-directory: source
        shell: bash
        run: cargo build --locked --release -p supercharge-pager-bin --bin supercharge-pager --target ${{ matrix.target }}

      - name: Package CLI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="source/target/${{ matrix.target }}/release/supercharge-pager${{ matrix.ext }}"
          base="supercharge-${{ matrix.platform }}${{ matrix.ext }}"
          cp "$src" "dist/$base"
          cp "$src" "dist/sc-${{ matrix.platform }}${{ matrix.ext }}"
          chmod +x dist/* 2>/dev/null || true
          # Compressed copy for smaller downloads (raw binaries kept for compatibility).
          xz -9 -T0 -k "dist/$base"

      - name: Verify packaged CLI version
        shell: bash
        run: |
          set -euo pipefail
          expected="${SUPERCHARGE_VERSION:?}"
          bin="dist/supercharge-${{ matrix.platform }}${{ matrix.ext }}"
          test -f "$bin"
          # Digit/dot boundary so 1.4.19 does not match 11.4.19 or 1.4.190.
          expected_re="$(printf '%s' "$expected" | sed 's/[.]/[.]/g')"
          static_check() {
            # BSD grep cannot search past NUL bytes in Mach-O, so scan bytes in Python.
            if ! python3 -c 'import re,sys; data=open(sys.argv[2],"rb").read(); pat=re.compile((r"(?:[^0-9.]|^)"+re.escape(sys.argv[1])+r" \(").encode()); raise SystemExit(0 if pat.search(data) else 1)' "$expected" "$bin"; then
              echo "did not find stamped version ${expected} in $bin" >&2
              exit 1
            fi
          }
          if [ "${{ matrix.runnable }}" = "true" ]; then
            if ! out="$("$bin" --version 2>&1)"; then
              echo "$bin --version failed on a runnable target; refusing to fall back to a static scan" >&2
              echo "$out" >&2
              exit 1
            fi
            echo "binary --version: $out"
            reported="$(printf '%s\n' "$out" | awk 'NF { print $2; exit }')"
            if [ -z "$reported" ] || [ "$reported" != "$expected" ]; then
              echo "Packaged binary version does not match ${expected}." >&2
              echo "Reported: ${out}" >&2
              exit 1
            fi
          else
            echo "static version check only: ${{ matrix.platform }} is not natively executable on this runner"
            static_check
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: dist/*

  build-daemon:
    name: Daemon linux-x86_64
    if: ${{ github.event_name == 'repository_dispatch' && (github.event.client_payload.build_daemon != false) || github.event_name == 'workflow_dispatch' && inputs.build_daemon }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SUPERCHARGE_SOURCE_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1

      - name: Install native build prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"
          rm -f source/bin/protoc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          key: daemon-linux-x86_64
          cache-on-failure: true

      - name: Stamp release version into the build
        shell: bash
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "SUPERCHARGE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build daemon release binary
        working-directory: source
        run: cargo build --locked --release -p supercharge-superagent --features e2b --bin supercharge-superagent-server

      - name: Package daemon artifact
        run: |
          mkdir -p dist
          cp source/target/release/supercharge-superagent-server dist/supercharge-superagent-server-linux-x86_64
          cp dist/supercharge-superagent-server-linux-x86_64 dist/superagent-server-linux-x86_64
          chmod +x dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-linux-x86_64
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [build-cli, build-daemon]
    if: always() && needs.build-cli.result == 'success' && (needs.build-daemon.result == 'success' || needs.build-daemon.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check out private source (E2B template)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SUPERCHARGE_SOURCE_TOKEN }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            sandbox/e2b-agent-template
            deploy/install-supercharge.sh

      - name: Prepare release bundle
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ env.RELEASE_TAG }}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cp scripts/install.sh release/install.sh
          cp scripts/install.ps1 release/install.ps1
          if [ -f source/deploy/install-supercharge.sh ]; then
            cp source/deploy/install-supercharge.sh release/install-supercharge.sh
            chmod +x release/install-supercharge.sh
          fi
          chmod +x release/install.sh
          # download-artifact does not preserve executable bits. Without this,
          # the publish runner fails linux-x86_64 --version with Permission denied.
          find release -type f ! -name '*.xz' ! -name '*.gz' ! -name '*.json' \
            ! -name 'SHA256SUMS' ! -name 'version' ! -name '*.ps1' -exec chmod +x {} +
          printf '%s\n' "$VERSION" > release/version
          if [ -d source/sandbox/e2b-agent-template ]; then
            tar -C source/sandbox -czf release/superagent-e2b-template-source.tar.gz e2b-agent-template
          fi
          cat > release/e2b-manifest.json <<EOF
          {"version":"${TAG}","daemon":"supercharge-superagent-server-linux-x86_64","cli":"supercharge-linux-x86_64"}
          EOF
          sha256sum release/* > release/SHA256SUMS
          ls -la release/
          cat release/SHA256SUMS

      - name: Verify release artifacts match the tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ env.RELEASE_TAG }}"
          expected="${TAG#v}"
          file_ver="$(tr -d '[:space:]' < release/version)"
          if [ "$file_ver" != "$expected" ]; then
            echo "release/version is ${file_ver}, expected ${expected}" >&2
            exit 1
          fi
          expected_re="$(printf '%s' "$expected" | sed 's/[.]/[.]/g')"
          found=0
          # The publish job runs on ubuntu-24.04, so only linux-x86_64 can be
          # executed natively. Every other platform is static-checked with a
          # digit/dot boundary; that limit is logged per asset.
          for bin in release/supercharge-linux-x86_64 release/supercharge-linux-aarch64 \
                     release/supercharge-macos-x86_64 release/supercharge-macos-aarch64 \
                     release/supercharge-windows-x86_64.exe release/supercharge-windows-aarch64.exe; do
            [ -f "$bin" ] || continue
            found=$((found + 1))
            base="$(basename "$bin")"
            if [ "$base" = "supercharge-linux-x86_64" ]; then
              if ! out="$("$bin" --version 2>&1)"; then
                echo "$bin --version failed on the publish runner; refusing to fall back to a static scan" >&2
                echo "$out" >&2
                exit 1
              fi
              echo "$bin --version: $out"
              reported="$(printf '%s\n' "$out" | awk 'NF { print $2; exit }')"
              if [ -z "$reported" ] || [ "$reported" != "$expected" ]; then
                echo "$bin --version does not match ${expected}: ${out}" >&2
                exit 1
              fi
            else
              echo "static version check only for $bin (not natively executable on ubuntu-24.04)"
              if ! python3 -c 'import re,sys; data=open(sys.argv[2],"rb").read(); pat=re.compile((r"(?:[^0-9.]|^)"+re.escape(sys.argv[1])+r" \(").encode()); raise SystemExit(0 if pat.search(data) else 1)' "$expected" "$bin"; then
                echo "did not find stamped version ${expected} in $bin" >&2
                exit 1
              fi
            fi
          done
          if [ "$found" -lt 1 ]; then
            echo "no CLI binaries found to verify" >&2
            exit 1
          fi
          echo "verified $found CLI artifacts for ${expected}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite assets." >&2
            exit 1
          fi
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          Supercharge AI ${TAG}

          Install latest:
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | bash

          Install this version:
            curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | bash -s ${TAG#v}
          EOF
          gh release create "$TAG" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes-file "$NOTES_FILE"
          rm -f "$NOTES_FILE"
